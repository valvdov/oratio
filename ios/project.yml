name: Oratio
options:
  bundleIdPrefix: dev.valvdov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Oratio:
    type: application
    platform: iOS
    sources:
      - path: Oratio
      - path: Shared
    info:
      path: Oratio/Info.plist
      properties:
        CFBundleDisplayName: Oratio
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: >-
          Oratio needs the microphone to transcribe your dictation.
        NSSpeechRecognitionUsageDescription: >-
          Oratio uses on-device speech recognition to turn your voice into text.
    entitlements:
      path: Oratio/Oratio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.valvdov.oratio
    dependencies:
      - target: OratioKeyboard
        embed: true

  OratioKeyboard:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.valvdov.Oratio.keyboard
    sources:
      - path: OratioKeyboard
      - path: Shared
    info:
      path: OratioKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Oratio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ru-RU
            RequestsOpenAccess: true
        NSMicrophoneUsageDescription: >-
          Oratio needs the microphone to transcribe your dictation.
        NSSpeechRecognitionUsageDescription: >-
          Oratio uses on-device speech recognition to turn your voice into text.
    entitlements:
      path: OratioKeyboard/OratioKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.valvdov.oratio
